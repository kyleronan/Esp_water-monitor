# One rule, enforced from the test suite (there is no CI): tests/test_dangling_tasks.py
# shells out to ruff and skips cleanly when it is absent.
#
# RUF006: asyncio holds only a weak reference to a running task, so a bare
# create_task()/ensure_future() whose result is discarded can be collected
# mid-flight and the coroutine silently stops. Use app.task_registry.spawn().
# Blind spot: ruff does NOT flag the chained get_running_loop().create_task()
# form — test_dangling_tasks.py greps for it separately.

target-version = "py311"
line-length = 100

exclude = [
    "water_monitor/tests",
    "firmware",
]

[lint]
select = ["RUF006"]
