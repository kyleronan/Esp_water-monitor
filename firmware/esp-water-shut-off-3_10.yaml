# =============================================================================
# INTERVALS — Per-event waveform capture (firmware 3.10.0+, dual-circuit chunked streaming)
#
# A single ~50 Hz interval drives the whole waveform-capture engine. STRICTLY
# ADDITIVE — it only READS already-published sensor states (water_usage1,
# pressure_main_fast) and writes its own wf_* globals. It never touches the
# 200 Hz ADC loop, the pulse-counter ISR, the safety lambdas, or any valve
# action, so it cannot regress the shut-off device.
#
# Each captured event is delivered as a sequence of
# `esphome.water_monitor_waveform_chunk` events. A chunk fires every time a
# circuit's 1500-sample buffer fills (~30 s @ ~50 Hz) and also on event end.
# The add-on accumulates chunks by (boot_id, event_id) and stitches them on
# the final chunk. Native cadence is preserved regardless of event length —
# no decimation, no fixed-size resampling.
#
# Per-circuit layout: arrays indexed [2] where 0 = circuit_1 (main), 1 =
# circuit_2 (irrigation). 3.10.0 wires both circuits' flow + pressure
# sources into the state machine — circuit_2 captures alongside circuit_1.
# Per-circuit pre-roll rings keep each event's signature isolated. The
# single staging slot (wf_ev_pending) serialises HA event emission across
# circuits; with stage-fire under one tick this rarely contends.
#
# Staging is a single shared in-flight chunk: only one
# water_monitor_waveform_chunk event may be queued at a time. wf_ev_pending
# guards it. When the buffer fills and staging is blocked, the new sample
# is DROPPED and wf_chunk_drop_count++ — the buffer is NEVER written past
# index 1499. Buffer-full AND finalizing in the same tick collapses to a
# single final chunk.
#
# Wire format: see WaveformChunkAccumulator in water_monitor/app/event_detector.py
# and the wire-format table in plans/i-would-like-to-snug-lerdorf.md.
# =============================================================================
interval:
  - interval: 20ms
    then:
      - lambda: |-
          /* WAVEFORM CAPTURE ENGINE — chunked streaming. Strictly additive. */

          // ---- one-time per-boot init ----
          if (id(wf_boot_id) == 0) {
            uint32_t r = esphome::random_uint32();
            id(wf_boot_id) = (r == 0) ? 1u : r;
          }
          id(wf_tick) = id(wf_tick) + 1;

          // ---- helpers (stack-only lambdas, no heap allocation) ----
          auto to_i16 = [](float v) -> int16_t {
            float s = v * 100.0f;
            if (s > 32767.0f) s = 32767.0f;
            if (s < -32768.0f) s = -32768.0f;
            return (int16_t) lroundf(s);
          };
          auto b64 = [](const uint8_t *d, int len) -> std::string {
            static const char *T =
              "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            std::string out;
            out.reserve(((len + 2) / 3) * 4);
            int i = 0;
            while (i + 3 <= len) {
              uint32_t n = ((uint32_t) d[i] << 16) |
                           ((uint32_t) d[i + 1] << 8) | d[i + 2];
              out += T[(n >> 18) & 63]; out += T[(n >> 12) & 63];
              out += T[(n >> 6) & 63];  out += T[n & 63];
              i += 3;
            }
            int rem = len - i;
            if (rem == 1) {
              uint32_t n = (uint32_t) d[i] << 16;
              out += T[(n >> 18) & 63]; out += T[(n >> 12) & 63];
              out += '='; out += '=';
            } else if (rem == 2) {
              uint32_t n = ((uint32_t) d[i] << 16) | ((uint32_t) d[i + 1] << 8);
              out += T[(n >> 18) & 63]; out += T[(n >> 12) & 63];
              out += T[(n >> 6) & 63];  out += '=';
            }
            return out;
          };
          // Encode the first `len` int16 samples from a circuit's chunk buffer
          // into base64 little-endian bytes. Heap allocation bounded by chunk
          // size (max 1500 samples = 3000 bytes raw, ~4000 chars base64).
          auto encode_chunk = [&](int16_t *src, int len) -> std::string {
            if (len <= 0) return std::string();
            std::vector<uint8_t> bytes;
            bytes.resize((size_t) len * 2);
            for (int i = 0; i < len; i++) {
              uint16_t u = (uint16_t) src[i];
              bytes[2 * i]     = (uint8_t) (u & 0xFF);
              bytes[2 * i + 1] = (uint8_t) ((u >> 8) & 0xFF);
            }
            return b64(bytes.data(), (int) bytes.size());
          };
          // Stage one chunk for circuit c. Returns true on success, false if
          // staging was blocked by wf_ev_pending.
          // `is_final` triggers final-only metadata fields; on a non-final
          // chunk those fields are set to safe defaults but ignored by the
          // add-on (the wire-format spec only requires them when final=true).
          auto stage_chunk = [&](int c, bool is_final, uint32_t now_ms) -> bool {
            if (id(wf_ev_pending)) return false;
            int len = id(wf_chunk_len)[c];
            int16_t *fbuf = (c == 0) ? &id(wf_chunk_flow)[0][0]
                                      : &id(wf_chunk_flow)[1][0];
            int16_t *pbuf = (c == 0) ? &id(wf_chunk_press)[0][0]
                                      : &id(wf_chunk_press)[1][0];
            id(wf_ev_flow_b64)  = encode_chunk(fbuf, len);
            id(wf_ev_press_b64) = encode_chunk(pbuf, len);
            id(wf_ev_circuit)   = c;
            id(wf_ev_is_final)  = is_final;
            id(wf_ev_event_id)  = id(wf_event_id)[c];
            id(wf_ev_boot)      = id(wf_boot_id);
            id(wf_ev_seq)       = id(wf_chunk_seq)[c];
            id(wf_ev_s)         = id(wf_chunk_start_ms)[c];
            id(wf_ev_e)         = now_ms;
            if (is_final) {
              int fl = id(wf_evt_flags)[c] | 0x02;  // full_waveform_complete
              uint32_t dur = (uint32_t) (id(wf_event_end_ms)[c] -
                                          id(wf_event_start_ms)[c]);
              if (dur < 1000u) fl |= 0x10;          // event_too_short
              id(wf_evt_flags)[c] = fl;
              id(wf_ev_evt_s)     = id(wf_event_start_ms)[c];
              id(wf_ev_evt_e)     = id(wf_event_end_ms)[c];
              id(wf_ev_total)     = id(wf_chunk_seq)[c] + 1u;
              id(wf_ev_onset_seq) = id(wf_onset_seq)[c];
              id(wf_ev_onset_idx) = id(wf_onset_idx)[c];
              id(wf_ev_press_onset_seq) = id(wf_press_onset_seq)[c];
              id(wf_ev_press_onset_idx) = id(wf_press_onset_idx)[c];
              int dp = (id(wf_evt_pmax)[c] >= id(wf_evt_pmin)[c])
                       ? (id(wf_evt_pmax)[c] - id(wf_evt_pmin)[c]) : 0;
              id(wf_ev_pk) = id(wf_evt_pk)[c];
              id(wf_ev_dp) = dp;
              id(wf_ev_pd) = -1;  // chunk-stream propagation delay derived add-on side
              id(wf_ev_q)  = (fl & 0x01) ? 0 : 1;
              id(wf_ev_fl) = fl;
            } else {
              id(wf_ev_total)     = 0u;  // unused on non-final chunks
              id(wf_ev_evt_s)     = 0u;
              id(wf_ev_evt_e)     = 0u;
              id(wf_ev_onset_seq) = 0u;
              id(wf_ev_onset_idx) = 0;
              id(wf_ev_press_onset_seq) = -1;
              id(wf_ev_press_onset_idx) = -1;
              id(wf_ev_pk) = 0; id(wf_ev_dp) = 0;
              id(wf_ev_pd) = -1; id(wf_ev_q) = 0; id(wf_ev_fl) = 0;
            }
            id(wf_ev_pending) = true;
            return true;
          };

          // ---- 1. sample both circuits into their per-circuit pre-roll rings ----
          // Source IDs: water_usage1 / pressure_main_fast = circuit_1 (main),
          //             water_usage2 / pressure_irrigation_fast = circuit_2 (irrigation).
          float src_flow[2] = {
            id(water_usage1).state,
            id(water_usage2).state,
          };
          float src_press[2] = {
            id(pressure_main_fast).state,
            id(pressure_irrigation_fast).state,
          };
          bool clamped = false;
          int16_t cur_fi[2];
          int16_t cur_pi[2];
          bool flow_on[2];
          for (int c = 0; c < 2; c++) {
            float f = src_flow[c];
            float p = src_press[c];
            if (!std::isfinite(f)) { f = 0.0f; clamped = true; }
            if (!std::isfinite(p)) { p = 0.0f; clamped = true; }
            if (f < 0.0f) f = 0.0f;
            if (p < 0.0f) p = 0.0f;
            int16_t fi = to_i16(f);
            int16_t pi = to_i16(p);
            cur_fi[c] = fi;
            cur_pi[c] = pi;
            flow_on[c] = (f > 0.10f);
            int ri = id(wf_ring_idx)[c];
            id(wf_ring_flow)[c][ri] = fi;
            id(wf_ring_press)[c][ri] = pi;
            id(wf_ring_idx)[c] = (ri + 1) % 100;
            if (id(wf_ring_count)[c] < 100)
              id(wf_ring_count)[c] = id(wf_ring_count)[c] + 1;
          }

          // ---- 2. slow per-circuit pressure baseline (frozen while CAPTURING) ----
          for (int c = 0; c < 2; c++) {
            float p = src_press[c];
            if (!std::isfinite(p) || p < 0.0f) p = 0.0f;
            if (!id(wf_press_baseline_valid)[c]) {
              id(wf_press_baseline)[c] = p;
              id(wf_press_baseline_valid)[c] = true;
            } else if (!id(wf_capturing)[c]) {
              id(wf_press_baseline)[c] =
                id(wf_press_baseline)[c] + 0.02f * (p - id(wf_press_baseline)[c]);
            }
          }

          uint32_t now = millis();

          // ---- 3. per-circuit capture state machine ----
          for (int c = 0; c < 2; c++) {
            if (!id(wf_capturing)[c]) {
              // IDLE — watch for flow onset.
              if (!flow_on[c]) continue;
              // Reject onset if a previous final-chunk for this circuit hasn't
              // flushed yet (very rare — wf_ev_pending clears within one tick).
              if (id(wf_ev_pending) && id(wf_ev_is_final) &&
                  id(wf_ev_circuit) == c) {
                id(wf_overflow_count) = id(wf_overflow_count) + 1;
                id(waveform_overflow_dropped_count)->publish_state(
                  (float) id(wf_overflow_count));
                continue;
              }
              // Copy this circuit's 100-sample pre-roll into its chunk buffer.
              int n = id(wf_ring_count)[c];
              int ri = id(wf_ring_idx)[c];
              int start = (ri - n + 100) % 100;
              int16_t *fbuf = (c == 0) ? &id(wf_chunk_flow)[0][0]
                                          : &id(wf_chunk_flow)[1][0];
              int16_t *pbuf = (c == 0) ? &id(wf_chunk_press)[0][0]
                                          : &id(wf_chunk_press)[1][0];
              int pk = 0, pmin = 32767, pmax = -32768;
              for (int k = 0; k < n; k++) {
                int src = (start + k) % 100;
                int16_t f = id(wf_ring_flow)[c][src];
                int16_t p = id(wf_ring_press)[c][src];
                fbuf[k] = f; pbuf[k] = p;
                if (f > pk) pk = f;
                if (p < pmin) pmin = p;
                if (p > pmax) pmax = p;
              }
              int onset = (n > 0) ? (n - 1) : 0;
              id(wf_chunk_len)[c]      = n;
              id(wf_chunk_seq)[c]      = 0;
              id(wf_chunk_start_ms)[c] = now;
              id(wf_event_id)[c]       = id(wf_event_counter) + 1;
              id(wf_event_counter)     = id(wf_event_counter) + 1;
              id(wf_event_start_ms)[c] = now;
              id(wf_event_end_ms)[c]   = now;
              id(wf_zero_ms)[c]        = now;
              id(wf_onset_seq)[c]      = 0;
              id(wf_onset_idx)[c]      = onset;
              id(wf_evt_pk)[c]         = pk;
              id(wf_evt_pmin)[c]       = (n > 0) ? pmin : 32767;
              id(wf_evt_pmax)[c]       = (n > 0) ? pmax : -32768;
              int fl = 0;
              if (n >= 75) fl |= 0x01;  // pre-roll covers >= 1.5 s
              if (clamped) fl |= 0x40;  // a sample was clamped
              id(wf_evt_flags)[c] = fl;
              // Pressure-transient onset (earliest sample above baseline + 0.5 PSI).
              int po = -1;
              float thr = (id(wf_press_baseline)[c] + 0.5f) * 100.0f;
              for (int k = 0; k <= onset; k++) {
                if ((float) pbuf[k] >= thr) { po = k; break; }
              }
              id(wf_press_onset_seq)[c] = (po >= 0) ? 0 : -1;
              id(wf_press_onset_idx)[c] = po;
              id(wf_capturing)[c] = true;
              continue;
            }

            // CAPTURING — try to append the current sample to circuit c's chunk.
            int len = id(wf_chunk_len)[c];
            int16_t *fbuf = (c == 0) ? &id(wf_chunk_flow)[0][0]
                                        : &id(wf_chunk_flow)[1][0];
            int16_t *pbuf = (c == 0) ? &id(wf_chunk_press)[0][0]
                                        : &id(wf_chunk_press)[1][0];

            // Buffer-full handling. NEVER write past index 1499.
            if (len >= 1500) {
              // Check if we should finalize this tick (collapse buffer-full+final
              // into a single final chunk rather than non-final + zero-payload final).
              bool ready_to_finalize =
                !flow_on[c] &&
                ((uint32_t) (now - id(wf_zero_ms)[c]) >= 3000u);
              if (stage_chunk(c, ready_to_finalize, now)) {
                // Reset buffer for next chunk.
                id(wf_chunk_len)[c]      = 0;
                id(wf_chunk_seq)[c]     += 1;
                id(wf_chunk_start_ms)[c] = now;
                if (ready_to_finalize) {
                  id(wf_capturing)[c] = false;
                  continue;  // event complete — current sample skipped (acceptable: tail)
                }
                // Append the current sample into the now-empty buffer.
                fbuf[0] = cur_fi[c];
                pbuf[0] = cur_pi[c];
                id(wf_chunk_len)[c] = 1;
                if (cur_fi[c] > id(wf_evt_pk)[c]) id(wf_evt_pk)[c] = cur_fi[c];
                if (cur_pi[c] < id(wf_evt_pmin)[c]) id(wf_evt_pmin)[c] = cur_pi[c];
                if (cur_pi[c] > id(wf_evt_pmax)[c]) id(wf_evt_pmax)[c] = cur_pi[c];
                if (clamped) id(wf_evt_flags)[c] |= 0x40;
              } else {
                // Staging blocked — drop this sample, count it, retry next tick.
                id(wf_chunk_drop_count) = id(wf_chunk_drop_count) + 1;
                id(wf_evt_flags)[c] |= 0x04;  // resolution_reduced (chunk drop)
              }
            } else {
              // Buffer has room — append the current sample.
              fbuf[len] = cur_fi[c];
              pbuf[len] = cur_pi[c];
              id(wf_chunk_len)[c] = len + 1;
              if (cur_fi[c] > id(wf_evt_pk)[c]) id(wf_evt_pk)[c] = cur_fi[c];
              if (cur_pi[c] < id(wf_evt_pmin)[c]) id(wf_evt_pmin)[c] = cur_pi[c];
              if (cur_pi[c] > id(wf_evt_pmax)[c]) id(wf_evt_pmax)[c] = cur_pi[c];
              if (clamped) id(wf_evt_flags)[c] |= 0x40;
            }

            // Tail-timer + finalize logic.
            if (flow_on[c]) {
              id(wf_zero_ms)[c] = now;
            } else {
              if (id(wf_event_end_ms)[c] < id(wf_zero_ms)[c] ||
                  id(wf_event_end_ms)[c] == id(wf_event_start_ms)[c]) {
                // First tick of zero flow — record event end.
                id(wf_event_end_ms)[c] = now;
              }
              if ((uint32_t) (now - id(wf_zero_ms)[c]) >= 3000u &&
                  id(wf_capturing)[c]) {
                // 3 s of zero flow elapsed — try to send final chunk.
                // If the buffer happens to be empty (already flushed), this
                // stages a zero-payload final chunk with metadata only.
                if (stage_chunk(c, true, now)) {
                  id(wf_chunk_len)[c] = 0;
                  id(wf_capturing)[c] = false;
                }
                // If stage blocked, retry next tick. wf_capturing stays true.
              }
            }
          }

          // ---- 4. stage fairness — if both circuits CAPTURING + buffer-full,
          // alternate which one wins the wf_ev_pending slot per tick.
          // (Implemented inline in the loop above by iterating c in {0, 1};
          // wf_stage_rr is reserved for a future fairness rotation when both
          // circuits are routinely contending. Currently circuit_2 is idle.)
          id(wf_stage_rr) = (id(wf_stage_rr) + 1) % 2;

      # Fire the staged HA chunk event when wf_ev_pending is true. Runs in the
      # same 20ms tick as the staging lambda (ESPHome evaluates then: actions
      # sequentially), so staging-and-fire happens within one tick at the cost
      # of a short retry-loop if the event coroutine yields.
      - if:
          condition:
            lambda: 'return id(wf_ev_pending);'
          then:
            - homeassistant.event:
                event: esphome.water_monitor_waveform_chunk
                data_template:
                  schema:            "{{ schema }}"
                  transport_version: "{{ transport_version }}"
                  node:              "{{ node }}"
                  circuit:           "{{ circuit }}"
                  id:                "{{ id }}"
                  b:                 "{{ b }}"
                  seq:               "{{ seq }}"
                  s:                 "{{ s }}"
                  e:                 "{{ e }}"
                  fs:                "100"
                  ps:                "100"
                  flow:              "{{ flow }}"
                  press:             "{{ press }}"
                  final:             "{{ final }}"
                  event_s:           "{{ event_s }}"
                  event_e:           "{{ event_e }}"
                  total:             "{{ total }}"
                  onset_seq:         "{{ onset_seq }}"
                  onset_idx:         "{{ onset_idx }}"
                  press_onset_seq:   "{{ press_onset_seq }}"
                  press_onset_idx:   "{{ press_onset_idx }}"
                  pk:                "{{ pk }}"
                  dp:                "{{ dp }}"
                  pd:                "{{ pd }}"
                  q:                 "{{ q }}"
                  fl:                "{{ fl }}"
                variables:
                  schema:            !lambda 'return std::string("esp_water_monitor_waveform_chunk");'
                  transport_version: !lambda 'return std::string("1");'
                  node:              !lambda 'return App.get_name();'
                  circuit:           !lambda 'return std::string(id(wf_ev_circuit) == 0 ? "circuit_1" : "circuit_2");'
                  id:                !lambda 'return std::to_string(id(wf_ev_event_id));'
                  b:                 !lambda 'return std::to_string(id(wf_ev_boot));'
                  seq:               !lambda 'return std::to_string(id(wf_ev_seq));'
                  s:                 !lambda 'return std::to_string(id(wf_ev_s));'
                  e:                 !lambda 'return std::to_string(id(wf_ev_e));'
                  flow:              !lambda 'return id(wf_ev_flow_b64);'
                  press:             !lambda 'return id(wf_ev_press_b64);'
                  final:             !lambda 'return std::string(id(wf_ev_is_final) ? "true" : "false");'
                  event_s:           !lambda 'return std::to_string(id(wf_ev_evt_s));'
                  event_e:           !lambda 'return std::to_string(id(wf_ev_evt_e));'
                  total:             !lambda 'return std::to_string(id(wf_ev_total));'
                  onset_seq:         !lambda 'return std::to_string(id(wf_ev_onset_seq));'
                  onset_idx:         !lambda 'return std::to_string(id(wf_ev_onset_idx));'
                  press_onset_seq:   !lambda 'return std::to_string(id(wf_ev_press_onset_seq));'
                  press_onset_idx:   !lambda 'return std::to_string(id(wf_ev_press_onset_idx));'
                  pk:                !lambda 'return std::to_string(id(wf_ev_pk));'
                  dp:                !lambda 'return std::to_string(id(wf_ev_dp));'
                  pd:                !lambda 'return std::to_string(id(wf_ev_pd));'
                  q:                 !lambda 'return std::to_string(id(wf_ev_q));'
                  fl:                !lambda 'return std::to_string(id(wf_ev_fl));'
            - lambda: |-
                id(wf_ev_pending) = false;
                // Drop large staging strings to free heap promptly.
                id(wf_ev_flow_b64).clear();
                id(wf_ev_press_b64).clear();

# =============================================================================
# SCRIPTS — Leak test sequences
#
# Scripts are used for the leak test because they:
#   - Can be stopped mid-execution (script.stop cancels the settle delay cleanly)
#   - Run asynchronously so they don't block the sensor loop
#   - Can call valve actions (open/close) with the full action sequence
#
# Two scripts per circuit:
#   leak_test_run     — full test sequence (pre-checks, close, settle, monitor)
#   leak_test_restore — open valve if no fault is active; called by all outcomes
# =============================================================================
script:
  # ---------------------------------------------------------------------------
  # LEAK TEST RUN — Main circuit
  # Pre-checks valve state and fault, closes valve, waits 60s for EMA to settle,
  # then activates monitoring. If cancelled during settle, restore is called by
  # the turn_off_action which stops this script before calling restore.
  # ---------------------------------------------------------------------------
  - id: leak_test_run_main
    then:
      - if:
          condition:
            binary_sensor.is_on: closed_end_stop_valve1
          then:
            - lambda: |-
                id(leak_test_result_main) = 6;  // Not run — valve was closed
                ESP_LOGW("leak_test", "MAIN: test not started — valve is already closed. "
                  "Open the valve first so the line is pressurised.");
          else:
            - if:
                condition:
                  lambda: 'return !id(open_end_stop_valve1).state && !id(closed_end_stop_valve1).state;'
                then:
                  - lambda: |-
                      id(leak_test_result_main) = 6;  // Not run — valve mid-travel
                      ESP_LOGW("leak_test", "MAIN: test not started — valve is mid-travel "
                        "(neither end stop active). Wait for travel to complete.");
                else:
                  - if:
                      condition:
                        lambda: 'return id(fault_main);'
                      then:
                        - lambda: |-
                            id(leak_test_result_main) = 7;  // Not run — fault active
                            ESP_LOGW("leak_test", "MAIN: test not started — safety fault is active. "
                              "Reset the fault first.");
                      else:
                        # Pre-checks passed — begin sequence
                        - lambda: |-
                            id(leak_test_preparing_main) = true;
                            id(leak_test_result_main) = 8;  // Preparing
                            ESP_LOGI("leak_test", "MAIN: closing valve and waiting 60s for pressure to settle...");
                        - valve.close: main_water_valve
                        # 60-second settle — allows residual pressure dynamics
                        # (water hammer, thermal expansion, residual flow) to
                        # dissipate after the valve closes, so the baseline reading
                        # captured next is stable and noise-free.
                        - delay: 60s
                        # Guard: if cancelled during settle, preparing will be false.
                        # Also validates the baseline reading is a sane pressure value —
                        # the ADC-backed EMA sensor can return NaN or 0.0 on cold boot
                        # before the first valid sample arrives, which would make the
                        # leak threshold comparison undefined or always-pass.
                        - lambda: |-
                            if (!id(leak_test_preparing_main)) return;
                            float baseline = id(pressure_main).state;
                            if (isnan(baseline) || baseline < 1.0f) {
                              id(leak_test_result_main) = 6;  // Not run — sensor not ready
                              id(leak_test_preparing_main) = false;
                              id(leak_test_active_main) = false;
                              ESP_LOGW("leak_test", "MAIN: baseline invalid (%.1f PSI) — "
                                "ADC not settled after close, aborting test", baseline);
                              return;
                            }
                            id(leak_test_preparing_main) = false;
                            id(leak_test_elapsed_main) = 0.0f;
                            id(leak_test_start_ms_main) = millis();
                            id(leak_test_baseline_main) = baseline;
                            id(leak_test_active_main) = true;
                            id(leak_test_result_main) = 1;  // In progress
                            ESP_LOGI("leak_test", "MAIN: test started. Baseline: %.1f PSI, "
                              "Threshold: %.1f PSI, Duration: %.0f min",
                              id(leak_test_baseline_main),
                              id(leak_threshold_psi_main).state,
                              id(leak_duration_main).state);

  # ---------------------------------------------------------------------------
  # LEAK TEST RESTORE — Main circuit
  # Opens the main valve if no safety fault is active. Called by every test
  # outcome — the fault guard ensures a concurrent high-flow fault (which closed
  # the valve for a real reason) is not overridden by the restore.
  # ---------------------------------------------------------------------------
  - id: leak_test_restore_main
    then:
      - if:
          condition:
            lambda: 'return !id(fault_main);'
          then:
            - valve.open: main_water_valve
            - logger.log:
                level: INFO
                tag: leak_test
                format: "MAIN: valve restored to open after leak test"

  # ---------------------------------------------------------------------------
  # LEAK TEST RUN — Irrigation circuit
  # Same sequence as main circuit.
  # ---------------------------------------------------------------------------
  - id: leak_test_run_irr
    then:
      - if:
          condition:
            binary_sensor.is_on: closed_end_stop_valve2
          then:
            - lambda: |-
                id(leak_test_result_irr) = 6;  // Not run — valve was closed
                ESP_LOGW("leak_test", "IRRIGATION: test not started — valve is already closed. "
                  "Open the valve first so the line is pressurised.");
          else:
            - if:
                condition:
                  lambda: 'return !id(open_end_stop_valve2).state && !id(closed_end_stop_valve2).state;'
                then:
                  - lambda: |-
                      id(leak_test_result_irr) = 6;  // Not run — valve mid-travel
                      ESP_LOGW("leak_test", "IRRIGATION: test not started — valve is mid-travel "
                        "(neither end stop active). Wait for travel to complete.");
                else:
                  - if:
                      condition:
                        lambda: 'return id(fault_irrigation);'
                      then:
                        - lambda: |-
                            id(leak_test_result_irr) = 7;  // Not run — fault active
                            ESP_LOGW("leak_test", "IRRIGATION: test not started — safety fault is active. "
                              "Reset the fault first.");
                      else:
                        - lambda: |-
                            id(leak_test_preparing_irr) = true;
                            id(leak_test_result_irr) = 8;  // Preparing
                            ESP_LOGI("leak_test", "IRRIGATION: closing valve and waiting 60s for pressure to settle...");
                        - valve.close: irrigation_water_valve
                        - delay: 60s
                        - lambda: |-
                            if (!id(leak_test_preparing_irr)) return;
                            float baseline = id(pressure_irrigation).state;
                            if (isnan(baseline) || baseline < 1.0f) {
                              id(leak_test_result_irr) = 6;  // Not run — sensor not ready
                              id(leak_test_preparing_irr) = false;
                              id(leak_test_active_irr) = false;
                              ESP_LOGW("leak_test", "IRRIGATION: baseline invalid (%.1f PSI) — "
                                "ADC not settled after close, aborting test", baseline);
                              return;
                            }
                            id(leak_test_preparing_irr) = false;
                            id(leak_test_elapsed_irr) = 0.0f;
                            id(leak_test_start_ms_irr) = millis();
                            id(leak_test_baseline_irr) = baseline;
                            id(leak_test_active_irr) = true;
                            id(leak_test_result_irr) = 1;  // In progress
                            ESP_LOGI("leak_test", "IRRIGATION: test started. Baseline: %.1f PSI, "
                              "Threshold: %.1f PSI, Duration: %.0f min",
                              id(leak_test_baseline_irr),
                              id(leak_threshold_psi_irr).state,
                              id(leak_duration_irr).state);

  # ---------------------------------------------------------------------------
  # LEAK TEST RESTORE — Irrigation circuit
  # ---------------------------------------------------------------------------
  - id: leak_test_restore_irr
    then:
      - if:
          condition:
            lambda: 'return !id(fault_irrigation);'
          then:
            - valve.open: irrigation_water_valve
            - logger.log:
                level: INFO
                tag: leak_test
                format: "IRRIGATION: valve restored to open after leak test"

# =============================================================================
# VALVES
# Template valves provide the Home Assistant valve entity for each circuit.
#
# State reporting (lambda):
#   - Returns OPEN if the open end stop is active (valve fully open)
#   - Returns CLOSED if the closed end stop is active (valve fully closed)
#   - Returns unknown {} if neither end stop is active (mid-travel or
#     position not yet confirmed after boot)
#
# Open action sequence:
#   1. Check fault flag — block open if fault active, log a warning
#   2. De-energise RESET (close) coil — ensures it is fully off
#   3. Wait 20ms — mandatory inter-coil gap (2x the RT424F12 max operate time)
#   4. Pulse SET coil 15ms then de-energise — relay latches, motor starts
#   5. Wait 15000ms — allow time for full valve travel
#      (increase if spurious end-stop-timeout faults occur at low temperature
#      or low supply voltage; decrease if your motor travels much faster)
#   6. Check open end stop — if not active, raise fault, publish CLOSED
#
# Close action (always permitted — safety action, no fault check):
#   Same sequence in reverse. Fault raised if closed end stop not reached.
#
# Relay coil timing (TE RT424F12):
#   SET operate time: max 10ms  |  RESET time: max 5ms
#   Pulse used: 15ms  |  Inter-coil gap: 20ms
# =============================================================================
valve:
  - platform: template
    name: "${circuit_1_name} Water Valve"
    device_class: water
    web_server:
      sorting_group_id: group_main_status
      sorting_weight: 1
    id: main_water_valve
    lambda: |-
      if (id(open_end_stop_valve1).state && id(closed_end_stop_valve1).state) {
        // Both end stops active simultaneously — wiring fault (shorted or stuck switch).
        // Return unknown so HA doesn't silently report VALVE_OPEN.
        ESP_LOGE("valve", "MAIN: both end stops active simultaneously — wiring fault");
        return {};
      }
      if (id(open_end_stop_valve1).state) return VALVE_OPEN;
      if (id(closed_end_stop_valve1).state) return VALVE_CLOSED;
      return {};
    open_action:
      - if:
          condition:
            lambda: 'return id(fault_main);'
          then:
            - logger.log:
                level: WARN
                format: "Main valve open blocked — safety fault active. Reset fault first."
          else:
            - if:
                condition:
                  lambda: 'return id(open_in_flight_main);'
                then:
                  - logger.log:
                      level: DEBUG
                      tag: valve
                      format: "MAIN: open already in flight — ignoring duplicate request"
                else:
                  - lambda: 'id(open_in_flight_main) = true;'
                  - switch.turn_off: relay_closed_valve1
                  - delay: 20ms
                  - switch.turn_on: relay_open_valve1
                  - delay: 15ms
                  - switch.turn_off: relay_open_valve1
                  - delay: 15000ms
                  - if:
                      condition:
                        # Check both: guard still set (open truly in flight) AND end stop not reached.
                        # Without the guard check, a close that completes during the 15s travel window
                        # deactivates the end stop — triggering a false motor fault.
                        lambda: 'return id(open_in_flight_main) && !id(open_end_stop_valve1).state;'
                      then:
                        - lambda: |-
                            id(fault_main) = true;
                            id(fault_reason_main_str) = "Motor fault — open end stop not reached";
                            id(fault_reason_main).publish_state(id(fault_reason_main_str));
                            id(open_in_flight_main) = false;
                            ESP_LOGE("valve", "MAIN: open end stop not reached after 15000ms — motor/wiring fault");
    close_action:
      # Guard against repeated valve.close calls while a close is already
      # in flight. The guard is set on first entry, cleared when the open
      # or closed end stop fires (see end stop on_press handlers above).
      # If a close fails (end stop never reached) the guard stays set —
      # opening the valve later clears it via the open end stop on_press.
      - if:
          condition:
            lambda: 'return id(close_in_flight_main);'
          then:
            - lambda: |-
                if (id(fault_main)) {
                  ESP_LOGW("valve", "MAIN: fault-triggered close requested but close-in-flight guard is set "
                    "— valve may be mid-travel or in recovery after a failed close. Close will execute once the open end stop fires.");
                } else {
                  ESP_LOGD("valve", "MAIN: close already in flight — ignoring duplicate request");
                }
          else:
            - lambda: 'id(close_in_flight_main) = true;'
            - switch.turn_off: relay_open_valve1
            - delay: 20ms
            - switch.turn_on: relay_closed_valve1
            - delay: 15ms
            - switch.turn_off: relay_closed_valve1
            - delay: 15000ms
            - if:
                condition:
                  binary_sensor.is_off: closed_end_stop_valve1
                then:
                  - lambda: |-
                      id(fault_main) = true;
                      id(fault_reason_main_str) = "Motor fault — closed end stop not reached";
                      id(fault_reason_main).publish_state(id(fault_reason_main_str));
                      ESP_LOGE("valve", "MAIN: closed end stop not reached after 15000ms — motor/wiring fault");

  - platform: template
    name: "${circuit_2_name} Water Valve"
    device_class: water
    web_server:
      sorting_group_id: group_irr_status
      sorting_weight: 1
    id: irrigation_water_valve
    lambda: |-
      if (id(open_end_stop_valve2).state && id(closed_end_stop_valve2).state) {
        ESP_LOGE("valve", "IRRIGATION: both end stops active simultaneously — wiring fault");
        return {};
      }
      if (id(open_end_stop_valve2).state) return VALVE_OPEN;
      if (id(closed_end_stop_valve2).state) return VALVE_CLOSED;
      return {};
    open_action:
      - if:
          condition:
            lambda: 'return id(fault_irrigation);'
          then:
            - logger.log:
                level: WARN
                format: "Irrigation valve open blocked — safety fault active. Reset fault first."
          else:
            - if:
                condition:
                  lambda: 'return id(open_in_flight_irr);'
                then:
                  - logger.log:
                      level: DEBUG
                      tag: valve
                      format: "IRRIGATION: open already in flight — ignoring duplicate request"
                else:
                  - lambda: 'id(open_in_flight_irr) = true;'
                  - switch.turn_off: relay_closed_valve2
                  - delay: 20ms
                  - switch.turn_on: relay_open_valve2
                  - delay: 15ms
                  - switch.turn_off: relay_open_valve2
                  - delay: 15000ms
                  - if:
                      condition:
                        # Same guard-check pattern as main valve — see main open_action comment.
                        lambda: 'return id(open_in_flight_irr) && !id(open_end_stop_valve2).state;'
                      then:
                        - lambda: |-
                            id(fault_irrigation) = true;
                            id(fault_reason_irr_str) = "Motor fault — open end stop not reached";
                            id(fault_reason_irr).publish_state(id(fault_reason_irr_str));
                            id(open_in_flight_irr) = false;
                            ESP_LOGE("valve", "IRRIGATION: open end stop not reached after 15000ms — motor/wiring fault");
    close_action:
      # See main valve close_action for explanation of the close-in-flight guard.
      - if:
          condition:
            lambda: 'return id(close_in_flight_irr);'
          then:
            - lambda: |-
                if (id(fault_irrigation)) {
                  ESP_LOGW("valve", "IRRIGATION: fault-triggered close requested but close-in-flight guard is set "
                    "— valve may be mid-travel or in recovery after a failed close. Close will execute once the open end stop fires.");
                } else {
                  ESP_LOGD("valve", "IRRIGATION: close already in flight — ignoring duplicate request");
                }
          else:
            - lambda: 'id(close_in_flight_irr) = true;'
            - switch.turn_off: relay_open_valve2
            - delay: 20ms
            - switch.turn_on: relay_closed_valve2
            - delay: 15ms
            - switch.turn_off: relay_closed_valve2
            - delay: 15000ms
            - if:
                condition:
                  binary_sensor.is_off: closed_end_stop_valve2
                then:
                  - lambda: |-
                      id(fault_irrigation) = true;
                      id(fault_reason_irr_str) = "Motor fault — closed end stop not reached";
                      id(fault_reason_irr).publish_state(id(fault_reason_irr_str));
                      ESP_LOGE("valve", "IRRIGATION: closed end stop not reached after 15000ms — motor/wiring fault");