name: "Water Monitor"
version: "0.3.1-dev49"
slug: water_monitor
description: >-
  Intelligent water monitoring with fixture signature recognition,
  anomaly detection, and scheduled leak testing. Learns your home's
  normal water usage patterns and alerts on unusual events.
url: "https://github.com/kyleronan/Esp_water-monitor"
# amd64 and aarch64 only. Home Assistant stopped publishing 32-bit Debian base
# images after bookworm-2025.11.1, and the multi-platform manifest the Dockerfile
# now builds from carries these two architectures and no others. Independently,
# neither scikit-learn nor river publishes a wheel for armhf/armv7/i386 on any
# libc — so on those boards the learned-model tier AND the cluster engine would
# both be unavailable. Declaring support we cannot deliver is worse than not
# declaring it.
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
host_network: false
# /share access (dev34): large backups can't transit the ingress proxy (it
# rejects big uploads before the add-on sees them), so archives are exchanged
# through /share/water_monitor instead — Full Export written there, history
# archives imported from there. rw: the add-on both reads and writes it.
map:
  - share:rw
ingress: true
ingress_port: 8765
panel_icon: mdi:water-check
panel_title: "Water Monitor"
# false so NON-admin HA users can open the panel too. The add-on enforces its own
# roles (viewer / operator / admin): admins come from HA admin status, operators
# are an in-app allow-list (Settings → Access), everyone else is read-only. Set
# back to true to hard-restrict the whole UI to HA admins again.
panel_admin: false
ports:
  8765/tcp: null
ports_description:
  8765/tcp: "Web UI (use Ingress)"
options:
  log_level: "info"
  esp_device_name: "ESP Water Shut off"
  debug_capture_propagation: false
  dev_tools: false
  # Optional RBAC escape hatch: a HA user id ALWAYS treated as an add-on admin,
  # even if the add-on can't read HA's user list. Leave blank normally — admins
  # are detected from HA admin status automatically.
  bootstrap_admin_user_id: ""
  circuits:
    - circuit: "main"
      circuit_type: "fixture"
    - circuit: "irrigation"
      circuit_type: "zone"
schema:
  log_level: "list(trace|debug|info|warning|error|fatal)"
  esp_device_name: "str"
  debug_capture_propagation: "bool"
  dev_tools: "bool?"
  bootstrap_admin_user_id: "str?"
  circuits:
    - circuit: "str"
      circuit_type: "list(fixture|zone)"
