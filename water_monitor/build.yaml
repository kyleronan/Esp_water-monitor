# Debian, not Alpine, and that is a dependency decision rather than a taste
# one. scikit-learn publishes NO musllinux wheel at any version (checked every
# release through 1.9.0 — all manylinux), and Alpine's py3-scikit-learn is
# compiled against Alpine's py3-numpy, which no Alpine branch ships new enough
# to satisfy river's `numpy>=2.3.4` floor. On musl those two requirements are
# mutually exclusive; on glibc every piece resolves from a prebuilt wheel at a
# pinned version. Tags are per-arch because HA stopped building the 32-bit
# bases after 2025.11.1.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm-2026.03.0
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm-2026.02.0
  armhf: ghcr.io/home-assistant/armhf-base-debian:bookworm-2025.11.1
  armv7: ghcr.io/home-assistant/armv7-base-debian:bookworm-2025.11.1
  i386: ghcr.io/home-assistant/i386-base-debian:bookworm-2025.11.1
